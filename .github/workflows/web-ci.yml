name: Web management checks

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "web-server/**"
      - "scripts/start-web*"
      - "scripts/deploy-web*"
      - "scripts/smoke-web.sh"
      - "deploy-web.sh"
      - "start-web.bat"
      - "start-web.sh"
      - "src-tauri/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tailwind.config.cjs"
      - "tsconfig*.json"
      - "rust-toolchain.toml"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "web-server/**"
      - "scripts/start-web*"
      - "scripts/deploy-web*"
      - "scripts/smoke-web.sh"
      - "deploy-web.sh"
      - "start-web.bat"
      - "start-web.sh"
      - "src-tauri/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tailwind.config.cjs"
      - "tsconfig*.json"
      - "rust-toolchain.toml"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DISPLAY: ""
      WAYLAND_DISPLAY: ""
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        run: |
          # Node 22.12 bundles Corepack with an outdated npm signing-key set.
          npm install --global corepack@0.31.0
          corepack enable
          corepack install
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libssl-dev
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-server -> target
          shared-key: web-linux
      - name: Frontend tests and build
        run: |
          pnpm typecheck
          pnpm test:web
          pnpm test:web-launcher
          pnpm test:web-deploy
          sh -n start-web.sh
          bash -n deploy-web.sh
          bash -n scripts/smoke-web.sh
          pnpm build:web
          pnpm exec prettier --check web scripts/start-web.mjs scripts/start-web.test.mjs scripts/deploy-web.test.mjs
      - name: Backend checks without a display server
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path web-server/Cargo.toml --check
          cargo clippy --locked --manifest-path web-server/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path web-server/Cargo.toml
      - name: Shared business tests without desktop features
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features web --lib --config 'profile.dev.debug=0' --target-dir web-server/target -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features web --lib --config 'profile.test.debug=0' --target-dir web-server/target
      - name: Reject desktop dependencies in the Web build
        run: |
          cargo tree --locked --manifest-path web-server/Cargo.toml --edges normal,build --prefix none > "$RUNNER_TEMP/web-dependencies"
          if grep -E '^(tauri([ -]|$)|gtk([ -]|$)|gdk([ -]|$)|webkit2gtk|wry([ -]|$)|tray-icon|muda([ -]|$)|arboard([ -]|$))' "$RUNNER_TEMP/web-dependencies"; then
            exit 1
          fi
      - name: Start the Web service without a display server
        run: |
          cargo build --locked --manifest-path web-server/Cargo.toml
          bash scripts/smoke-web.sh web-server/target/debug/cc-switch-web web/dist

  web-alinux3:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: alibaba-cloud-linux-3-registry.cn-hangzhou.cr.aliyuncs.com/alinux3/alinux3:3.9.1
    env:
      DISPLAY: ""
      WAYLAND_DISPLAY: ""
    steps:
      - name: Prepare checkout dependencies
        run: dnf install -y git ca-certificates curl
      - uses: actions/checkout@v6
      - name: Install Alibaba Cloud Linux native dependencies
        shell: bash
        run: |
          source deploy-web.sh
          sudo() { "$@"; }
          install_dependencies alinux
          dnf install -y python3 systemd
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check deployment scripts
        run: node --test scripts/deploy-web.test.mjs
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: web-server -> target
          shared-key: web-alinux3
      - name: Build and test natively on Alibaba Cloud Linux 3
        shell: bash
        run: |
          cargo tree --locked --manifest-path web-server/Cargo.toml --edges normal,build --prefix none > /tmp/web-dependencies
          if grep -E '^(tauri([ -]|$)|gtk([ -]|$)|gdk([ -]|$)|webkit2gtk|wry([ -]|$)|tray-icon|muda([ -]|$)|arboard([ -]|$))' /tmp/web-dependencies; then
            exit 1
          fi
          cargo test --locked --manifest-path web-server/Cargo.toml
          cargo build --locked --manifest-path web-server/Cargo.toml
          # Frontend production assets are built in the Ubuntu job; exercise static serving here.
          mkdir -p "$RUNNER_TEMP/web-assets"
          printf '<!doctype html><title>Web runtime check</title>' > "$RUNNER_TEMP/web-assets/index.html"
          bash scripts/smoke-web.sh web-server/target/debug/cc-switch-web "$RUNNER_TEMP/web-assets"
