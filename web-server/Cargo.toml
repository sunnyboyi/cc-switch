[package]
name = "cc-switch-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cc-switch = { path = "../src-tauri", features = ["web"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.5", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
futures = "0.3"
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
zip = "2.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
